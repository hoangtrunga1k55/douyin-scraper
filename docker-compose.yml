services:
  douyin-api:
    build: .
    container_name: douyin-downloader
    restart: unless-stopped
    depends_on:
      - mongo
      - redis
    ports:
      - "3000:3000"
      - "6080:6080"
    # Port 3000 and 6080 accessed via Nginx in prod, mapped for local access
    volumes:
      - ./downloads:/app/downloads
      - ./browser_data:/app/.browser_data
      - ./.env:/app/.env:ro
    environment:
      - NODE_ENV=production
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
      - DISPLAY=:99
      - MONGO_URI=mongodb://mongo:27017/douyindb
      - REDIS_HOST=redis
    # Required for Puppeteer
    security_opt:
      - seccomp=unconfined
    shm_size: '512mb'
    networks:
      - shared_proxy

  mongo:
    image: mongo:latest
    container_name: douyin-mongo
    restart: unless-stopped
    volumes:
      - ./mongo_data:/data/db
    networks:
      - shared_proxy

  redis:
    image: redis:7-alpine
    container_name: douyin-redis
    restart: unless-stopped
    networks:
      - shared_proxy

networks:
  shared_proxy:
    external: true
