services:
  douyin-api:
    build: .
    container_name: douyin-downloader
    restart: unless-stopped
    # Port 3000 and 6080 will only be routed internally by Nginx
    volumes:
      - ./downloads:/app/downloads
      - ./browser_data:/app/.browser_data
      - ./.env:/app/.env:ro
    environment:
      - NODE_ENV=production
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
      - DISPLAY=:99
    # Required for Puppeteer
    security_opt:
      - seccomp=unconfined
    shm_size: '512mb'
    networks:
      - shared_proxy

networks:
  shared_proxy:
    external: true
