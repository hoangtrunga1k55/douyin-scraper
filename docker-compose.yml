x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  douyin-api:
    build: .
    container_name: douyin-downloader
    restart: unless-stopped
    depends_on:
      - mongo
      - redis
    ports:
      - "3000:3000"
      - "6080:6080"
    # Port 3000 and 6080 accessed via Nginx in prod, mapped for local access
    volumes:
      - ./downloads:/app/downloads
      - ./browser_data:/app/.browser_data
      - ./browser_data_tiktok:/app/.browser_data_tiktok
      - ./.env:/app/.env
    environment:
      - NODE_ENV=production
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
      - DISPLAY=:99
      - MONGO_URI=mongodb://mongo:27017/douyindb
      - REDIS_HOST=redis
    # Required for Puppeteer
    security_opt:
      - seccomp=unconfined
    shm_size: '512mb'
    logging: *default-logging
    networks:
      - shared_proxy

  mongo:
    image: mongo:latest
    container_name: douyin-mongo
    restart: unless-stopped
    volumes:
      - ./mongo_data:/data/db
    logging: *default-logging
    networks:
      - shared_proxy

  redis:
    image: redis:7-alpine
    container_name: douyin-redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
    volumes:
      - ./redis_data:/data
    logging: *default-logging
    networks:
      - shared_proxy

networks:
  shared_proxy:
    external: true