server {
    listen 80;
    server_name thq-solution-tools.io.vn www.thq-solution-tools.io.vn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name thq-solution-tools.io.vn www.thq-solution-tools.io.vn;

    ssl_certificate /etc/letsencrypt/live/thq-solution-tools.io.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thq-solution-tools.io.vn/privkey.pem;

    # Docker internal DNS - giúp Nginx resolve tên container lúc runtime, không crash lúc startup
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 1. Backend API (Node.js App)
    location / {
        set $backend http://douyin-downloader:3000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. VNC Dashboard - Quét mã QR Login (Truy cập bằng: /douyin-login/vnc.html)
    location /douyin-login/ {
        # Strip /douyin-login/ prefix trước khi gửi đến noVNC
        set $vnc http://douyin-downloader:6080;
        rewrite ^/douyin-login/(.*) /$1 break;
        proxy_pass $vnc;

        # Hỗ trợ WebSockets của noVNC
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name n8n.thq-solution-tools.io.vn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name n8n.thq-solution-tools.io.vn;

    ssl_certificate /etc/letsencrypt/live/n8n.thq-solution-tools.io.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/n8n.thq-solution-tools.io.vn/privkey.pem;

    resolver 127.0.0.11 ipv6=off valid=30s;
    set $n8n_upstream http://n8n:5678;

    location / {
        proxy_pass $n8n_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
