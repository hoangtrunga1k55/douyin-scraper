server {
    listen 80;
    server_name thq-solution-tools.io.vn www.thq-solution-tools.io.vn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name thq-solution-tools.io.vn www.thq-solution-tools.io.vn;

    ssl_certificate /etc/letsencrypt/live/thq-solution-tools.io.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thq-solution-tools.io.vn/privkey.pem;

    # 1. Backend API (Node.js App)
    location / {
        proxy_pass http://douyin-downloader:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. VNC Dashboard - Quét mã QR Login (Truy cập bằng: /douyin-login/vnc.html)
    location /douyin-login/ {
        # Chuyển traffic vào port 6080 của noVNC (Lưu ý dấu / ở cuối rất quan trọng)
        proxy_pass http://douyin-downloader:6080/;

        # Hỗ trợ WebSockets của noVNC
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}